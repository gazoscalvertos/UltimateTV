# The Hub on the TV box itself (tools/box/install.sh with HUB=local adds this through COMPOSE_FILE
# in .env). It uses the box's own network, so the TV app reaches it at 127.0.0.1 and phones at the
# box's address wherever the box is plugged in, and the Hub can tell phones which address that is.
services:
  hub:
    network_mode: host
    ports: !reset []
    environment:
      PORT: ${HUB_PORT:-8095}
    volumes:
      # The NAS as the trip sees it: the music videos travel.sh copied, at the paths they have on
      # the NAS, and anything recorded or downloaded on the trip (sent back to the NAS by "home").
      - /var/lib/ultimatetv/media/mnt/nas:/mnt/nas
      - /var/lib/ultimatetv/media/mnt/nas2:/mnt/nas2
