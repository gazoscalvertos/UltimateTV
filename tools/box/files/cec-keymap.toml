# The Hisense remote over HDMI-CEC → keys the UltimateTV UI understands (shared/src/keys.ts).
# Scancodes are CEC "User Control" codes. Loaded by ir-keytable for the Pulse-Eight adapter.
[[protocols]]
name = "ultimatetv-cec"
protocol = "cec"
[protocols.scancodes]
0x00 = "KEY_ENTER"      # Select / OK
0x01 = "KEY_UP"
0x02 = "KEY_DOWN"
0x03 = "KEY_LEFT"
0x04 = "KEY_RIGHT"
0x09 = "KEY_HOME"       # Root menu / Home
0x0a = "KEY_F6"         # Setup menu → Info
0x0b = "KEY_F5"         # Contents menu → Guide
0x0d = "KEY_ESC"        # Exit / Back
0x91 = "KEY_ESC"        # Back on newer TVs
0x20 = "KEY_0"
0x21 = "KEY_1"
0x22 = "KEY_2"
0x23 = "KEY_3"
0x24 = "KEY_4"
0x25 = "KEY_5"
0x26 = "KEY_6"
0x27 = "KEY_7"
0x28 = "KEY_8"
0x29 = "KEY_9"
0x30 = "KEY_PAGEUP"     # Channel up
0x31 = "KEY_PAGEDOWN"   # Channel down
0x35 = "KEY_F6"         # Display information → Info
0x53 = "KEY_F5"         # Electronic programme guide
0x44 = "KEY_SPACE"      # Play → play/pause
0x46 = "KEY_SPACE"      # Pause → play/pause
0x61 = "KEY_SPACE"      # Pause-play function
0x45 = "KEY_STOPCD"     # Stop
0x47 = "KEY_F9"         # Record
0x48 = "KEY_F7"         # Rewind
0x49 = "KEY_F8"         # Fast forward
0x4b = "KEY_F8"         # Forward (skip)
0x4c = "KEY_F7"         # Backward (skip)
0x71 = "KEY_F4"         # F1 (Blue)
0x72 = "KEY_F1"         # F2 (Red)
0x73 = "KEY_F2"         # F3 (Green)
0x74 = "KEY_F3"         # F4 (Yellow)
