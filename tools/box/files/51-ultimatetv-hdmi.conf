# WirePlumber: let the HDMI output carry Dolby Digital (Plus) and DTS untouched to the TV,
# and never suspend it (so sound doesn't clip the first second after a pause).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = {
      update-props = {
        iec958.codecs = [ "PCM" "AC3" "EAC3" "DTS" ]
        session.suspend-timeout-seconds = 0
        priority.session = 2000
      }
    }
  }
]
