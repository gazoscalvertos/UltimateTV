plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "tv.ultimate.client"
    // androidx.core 1.19.1 declares minCompileSdk=37 in its AAR metadata, so the client
    // has to compile against API 37. targetSdk stays 35: this only widens the APIs we
    // may call, it does not opt the app in to new runtime behaviour.
    compileSdk 37

    defaultConfig {
        applicationId "tv.ultimate.client"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.6.0"
    }

    // The same release key as the remote, and the same rules: it comes from the environment / CI
    // secrets and is never committed. See app/build.gradle and docs/android-signing.md.
    def keyPath = System.getenv("ANDROID_KEYSTORE_PATH")
    def keyFile = keyPath ? rootProject.file(keyPath) : null
    def hasReleaseKey = keyFile != null && keyFile.isFile()

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile keyFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Gradle's own debug key, so a build with no secrets still works.
        }
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : null
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Media3's download and extension APIs are marked unstable; we pin the version, so that's fine.
    lint {
        disable "UnsafeOptInUsageError"
        // Fires on any registerForActivityResult() unless androidx.fragment is on the classpath, but
        // this app has no fragments at all, so there is nothing to upgrade. It only bites
        // assembleRelease (and so #93's release signing); assembleDebug never runs this check.
        disable "InvalidFragmentVersionForActivityResult"
    }
}

def media3 = "1.7.1"

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.navigation:navigation-compose:2.10.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "com.google.code.gson:gson:2.15.0"
    // Scans the TV's pairing QR code with Google Play services' scanner: no camera permission needed.
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"

    // The player: ExoPlayer plays MPEG-TS (live TV), MKV, HEVC and HLS; Jellyfin's FFmpeg build
    // adds the sound formats phones can't decode themselves (AC-3, E-AC-3, DTS, TrueHD).
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-database:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2"
}
