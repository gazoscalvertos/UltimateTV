plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "tv.ultimate.client"
    compileSdk 35

    defaultConfig {
        applicationId "tv.ultimate.client"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    // The same key as the remote (see app/build.gradle), so every build installs over the last.
    signingConfigs {
        shared {
            storeFile rootProject.file("remote.keystore")
            storePassword "android"
            keyAlias "remote"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    // Media3's download and extension APIs are marked unstable; we pin the version, so that's fine.
    lint {
        disable "UnsafeOptInUsageError"
    }
}

def media3 = "1.7.1"

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "com.google.code.gson:gson:2.11.0"

    // The player: ExoPlayer plays MPEG-TS (live TV), MKV, HEVC and HLS; Jellyfin's FFmpeg build
    // adds the sound formats phones can't decode themselves (AC-3, E-AC-3, DTS, TrueHD).
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-database:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2"
}
