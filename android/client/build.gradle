plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "tv.ultimate.client"
    // androidx.core 1.19.1 declares minCompileSdk=37 in its AAR metadata, so the client
    // has to compile against API 37. targetSdk stays 35: this only widens the APIs we
    // may call, it does not opt the app in to new runtime behaviour.
    compileSdk 37

    defaultConfig {
        applicationId "tv.ultimate.client"
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName "0.7.0"
    }

    // Two builds of one app. They share a version and an application id, so only one can be
    // installed at a time — that is intended: a Fire stick and a phone are different devices, and
    // pairing is per device anyway.
    //
    //  google: phones and tablets. The same app as firetv; the flavour exists because the two
    //          update from different Hub addresses, so an installed phone never picks up the Fire
    //          TV build over itself (and the other way round).
    //  firetv: Amazon Fire TV and Fire sticks (#183): leanback launcher entry, banner, and a
    //          BuildConfig that points "Check for updates" at the Fire TV release.
    //
    // Neither build has any Google Play services in it (#198): the QR scanner lives in the
    // :scanner module, which uses CameraX and ZXing. What makes the Fire TV build work on Fire OS
    // is that the module has no Google components in its merged manifest at all.
    flavorDimensions "store"
    productFlavors {
        google {
            dimension "store"
            isDefault true
            // Where this build finds its own next version. Kept in BuildConfig so "Check for
            // updates" downloads the build that can actually be installed over the one running.
            buildConfigField "String", "UPDATE_PATH", "\"/api/client/app.apk\""
            buildConfigField "String", "UPDATE_PAGE", "\"/setup/client-app.json\""
            buildConfigField "String", "DEVICE_LABEL", "\"Android\""
        }
        firetv {
            dimension "store"
            // A Fire stick runs Fire OS 7 or 8, which is Android 11 or newer: no older floor needed.
            // Every Fire TV device is 32-bit ARM, but the FFmpeg decoder library ships every ABI,
            // so the APK works on all of them without an ABI filter.
            buildConfigField "String", "UPDATE_PATH", "\"/api/firetv/app.apk\""
            buildConfigField "String", "UPDATE_PAGE", "\"/setup/firetv-app.json\""
            buildConfigField "String", "DEVICE_LABEL", "\"Fire TV\""
        }
    }

    // The same release key as the remote, and the same rules: it comes from the environment / CI
    // secrets and is never committed. See app/build.gradle and docs/android-signing.md.
    def keyPath = System.getenv("ANDROID_KEYSTORE_PATH")
    def keyFile = keyPath ? rootProject.file(keyPath) : null
    def hasReleaseKey = keyFile != null && keyFile.isFile()

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile keyFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Gradle's own debug key, so a build with no secrets still works.
        }
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : null
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Media3's download and extension APIs are marked unstable; we pin the version, so that's fine.
    lint {
        disable "UnsafeOptInUsageError"
        // Fires on any registerForActivityResult() unless androidx.fragment is on the classpath, but
        // this app has no fragments at all, so there is nothing to upgrade. It only bites
        // assembleRelease (and so #93's release signing); assembleDebug never runs this check.
        disable "InvalidFragmentVersionForActivityResult"
    }
}

def media3 = "1.7.1"

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.navigation:navigation-compose:2.10.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "com.google.code.gson:gson:2.15.0"
    // Only in the phone build: Fire OS has no Google Play services, and this library's manifest
    // components run at process start, so the Fire TV build must not contain it at all (#183).

    // The player: ExoPlayer plays MPEG-TS (live TV), MKV, HEVC and HLS; Jellyfin's FFmpeg build
    // adds the sound formats phones can't decode themselves (AC-3, E-AC-3, DTS, TrueHD).
    // Reading the TV's pairing code from the camera. A module of its own so the phone remote uses
    // exactly the same camera code, and neither app depends on Google Play services (#198).
    implementation project(":scanner")

    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-database:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2"
}
