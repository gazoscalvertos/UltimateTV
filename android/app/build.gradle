plugins {
    id "com.android.application"
}

android {
    namespace "tv.ultimate.remote"
    compileSdk 35

    defaultConfig {
        applicationId "tv.ultimate.remote"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
