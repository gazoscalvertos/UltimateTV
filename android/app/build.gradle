plugins {
    id "com.android.application"
}

android {
    namespace "tv.ultimate.remote"
    compileSdk 35

    defaultConfig {
        applicationId "tv.ultimate.remote"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "0.8.0"
    }

    // The key that signs a release build is NOT in the repo. CI has it in repository secrets and
    // writes it out before building; for a release made by hand, point ANDROID_KEYSTORE_PATH at the
    // file and put the three passwords in the environment. See docs/android-signing.md.
    //
    // A debug build needs none of that: it uses the debug key Gradle makes on whatever machine is
    // building, so a pull request from anyone (and a local build with no secrets) still works.
    def keyPath = System.getenv("ANDROID_KEYSTORE_PATH")
    def keyFile = keyPath ? rootProject.file(keyPath) : null
    def hasReleaseKey = keyFile != null && keyFile.isFile()

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile keyFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Deliberately no signingConfig: Gradle's own debug key, so no secrets are needed.
        }
        release {
            // Null when there's no key: Gradle then makes an unsigned APK rather than failing, so
            // `gradle :app:assembleRelease` still tells you the code compiles without a key to hand.
            signingConfig hasReleaseKey ? signingConfigs.release : null
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Scans the TV's pairing QR code with Google Play services' scanner: no camera permission needed.
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
