plugins {
    id "com.android.application"
}

android {
    namespace "tv.ultimate.remote"
    compileSdk 35

    defaultConfig {
        applicationId "tv.ultimate.remote"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "0.4.0"
    }

    // One key for every build, so a new APK installs over the old one. (CI makes a fresh debug key
    // each run otherwise, and Android refuses an update signed with a different key.) It's a home
    // app installed by hand, so the key being public doesn't matter.
    signingConfigs {
        shared {
            storeFile rootProject.file("remote.keystore")
            storePassword "android"
            keyAlias "remote"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
