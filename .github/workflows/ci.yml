name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The box shell's Electron binary isn't needed to typecheck, test or build.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Clip packs pass the Hub's checks and the community list is up to date
        run: node tools/packs/index-packs.mjs --check
      - name: Check the probe bundle parses as ES2017
        run: npx esbuild tools/probe/dist/probe.js --target=es2017 --log-level=error > /dev/null

  box-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck tools/box/*.sh tools/pxe/*.sh tools/hub/*.sh tools/desktop/*.sh
      - name: Installer files are where the installer expects them
        run: |
          for f in cec-keymap.toml 51-ultimatetv-hdmi.conf 70-ultimatetv-cec.rules ultimatetv-cec-attach@.service ultimatetv.desktop kwinrulesrc kwinrc kscreenlockerrc; do
            test -f "tools/box/files/$f" || { echo "missing $f"; exit 1; }
          done
      - name: Probe runs on a machine with no display or CEC
        run: bash tools/box/probe.sh /tmp/probe.md && grep -q "## Missing tools" /tmp/probe.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ultimatetv-hub:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=2026-01-01T00:00:00Z
      - name: Smoke test the image
        run: |
          docker run -d --name hub -p 8080:8080 ultimatetv-hub:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/api/health | grep -q '"commit":"${{ github.sha }}"'
          curl -fsSI localhost:8080/app/ | grep -qi "cache-control: no-cache"
          curl -fsS localhost:8080/api/system
          curl -fsS localhost:8080/probe/ | grep -q "UltimateTV Probe"
          curl -fsS localhost:8080/app/ | grep -q "UltimateTV"
          curl -fsS localhost:8080/setup/ | grep -q "UltimateTV"
          curl -fsS localhost:8080/remote/ | grep -q "UltimateTV"
          docker exec hub sh -c 'make-test-clips /tmp/clips 1 && test -f /tmp/clips/clips.json'
          docker exec hub node --check tools/iptv/check-catchup.mjs
          # comskip (advert skipping) is there and finds all its libraries; openssl makes the HTTPS certificate.
          docker exec hub sh -c 'test -x /usr/local/bin/comskip && ! ldd /usr/local/bin/comskip | grep -q "not found"'
          docker exec hub openssl version
          docker rm -f hub

  pxe-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the PXE server image (compiles iPXE)
        uses: docker/build-push-action@v7
        with:
          context: tools/pxe
          push: false
          load: true
          tags: ultimatetv-pxe:ci
      - name: It writes the boot menu and install settings, and serves them
        run: |
          ip="$(hostname -I | awk '{print $1}')"
          docker run -d --name pxe -e PXE_IP="$ip" -e PXE_HTTP_PORT=18097 \
            -e BOX_MAC=AA:BB:CC:DD:EE:FF -e ADMIN_PASSWORD_HASH='$6$x$y' -e HUB_URL=http://hub:8095 --network host --cap-add NET_ADMIN ultimatetv-pxe:ci
          # The first start downloads the Arch installer (about 1 GB) before serving.
          for i in $(seq 1 300); do curl -fsS localhost:18097/box.conf && break; sleep 1; done
          curl -fsS localhost:18097/auto.sh -o /tmp/auto.sh && grep -q "Unattended Arch Linux install" /tmp/auto.sh
          test "$(docker inspect -f '{{.State.Running}}' pxe)" = true
          docker exec pxe grep -q "iseq \${mac} aa:bb:cc:dd:ee:ff" /srv/tftp/boot.ipxe
          docker exec pxe test -s /srv/tftp/ipxe.efi
          curl -fsSI localhost:18097/arch/boot/x86_64/vmlinuz-linux
          curl -fsSI localhost:18097/arch/x86_64/airootfs.sfs
      - name: PXE server log
        if: always()
        run: docker logs pxe || true

  # The TV app as an AppImage for Linux desktops (docs/desktop.md). The app updates itself from the
  # desktop-app release, so each build from main replaces the files there.
  desktop-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build the AppImage
        env:
          BRANCH: main
        run: bash tools/desktop/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ultimatetv-desktop-appimage
          path: |
            tools/desktop/out/UltimateTV-x86_64.AppImage
            tools/desktop/out/ultimatetv-desktop.json
          if-no-files-found: error
      - name: Publish the AppImage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-app > /dev/null 2>&1 || gh release create desktop-app --title "Desktop app (latest)" --notes "The TV app for Linux desktops, built from main by CI. See docs/desktop.md. The app updates itself from here (Settings › About)." --latest=false
          # The AppImage first, so an app that sees the new commit always finds its file.
          gh release upload desktop-app tools/desktop/out/UltimateTV-x86_64.AppImage --clobber
          gh release upload desktop-app tools/desktop/out/ultimatetv-desktop.json --clobber

  # The TV app as a Windows installer (#127). NSIS, installed for the current user, so it needs no
  # administrator. docs/desktop.md has the Windows section.
  #
  # Skipped until MPV_WIN_URL is set (Settings -> Secrets and variables -> Actions -> Variables):
  # the installer has to carry mpv, and no mpv binary is committed. A skipped job shows as grey
  # rather than a permanent red X, and the job starts working the moment the variable is added.
  desktop-windows:
    if: vars.MPV_WIN_URL != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Every step that runs a shell script says shell: bash: a Windows runner's default is
      # PowerShell, which would mangle it. bash there is Git Bash, which is what the scripts are
      # written for.
      - name: Put mpv inside the installer
        shell: bash
        env:
          MPV_WIN_URL: ${{ vars.MPV_WIN_URL }}
        run: bash tools/desktop/fetch-mpv.sh win
      - name: Build the x64 installer
        shell: bash
        env:
          BRANCH: main
          ARCH: x64
        run: bash tools/desktop/build-win.sh
      # Each build deletes tools/desktop/out before it starts (stage-app.sh), so this
      # architecture's files are moved out of the way first. The folder is beside out, not inside
      # it, or the second build would delete them too.
      - name: Keep the x64 output
        shell: bash
        run: |
          mkdir -p tools/desktop/kept
          mv tools/desktop/out/UltimateTV-Setup-x64.exe tools/desktop/out/UltimateTV-x64.zip \
            tools/desktop/out/ultimatetv-windows.json tools/desktop/out/ultimatetv-desktop.json tools/desktop/kept/
      # Windows on ARM is a small share of PCs: skipped rather than failed when no ARM mpv is set.
      - name: Put the ARM mpv in
        if: vars.MPV_WIN_ARM64_URL != ''
        shell: bash
        env:
          MPV_WIN_URL: ${{ vars.MPV_WIN_ARM64_URL }}
        run: |
          rm -rf tools/desktop/vendor/mpv
          bash tools/desktop/fetch-mpv.sh win
      - name: Build the arm64 installer
        if: vars.MPV_WIN_ARM64_URL != ''
        shell: bash
        env:
          BRANCH: main
          ARCH: arm64
        run: bash tools/desktop/build-win.sh
      - name: Gather the output
        shell: bash
        run: |
          mv tools/desktop/kept/* tools/desktop/out/
          rmdir tools/desktop/kept
      - uses: actions/upload-artifact@v7
        with:
          name: ultimatetv-desktop-windows
          path: |
            tools/desktop/out/UltimateTV-Setup-x64.exe
            tools/desktop/out/UltimateTV-Setup-arm64.exe
            tools/desktop/out/UltimateTV-x64.zip
            tools/desktop/out/UltimateTV-arm64.zip
            tools/desktop/out/ultimatetv-windows.json
            tools/desktop/out/ultimatetv-desktop.json
          if-no-files-found: error
      - name: Publish the installers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-app > /dev/null 2>&1 || gh release create desktop-app --title "Desktop app (latest)" --notes "The TV app for Windows, macOS and Linux desktops, built from main by CI. See docs/desktop.md. The app updates itself from here (Settings › About)." --latest=false
          # Only what this run built: the ARM files are absent when that leg was skipped.
          for f in UltimateTV-Setup-x64.exe UltimateTV-Setup-arm64.exe UltimateTV-x64.zip UltimateTV-arm64.zip; do
            if [ -f "tools/desktop/out/$f" ]; then gh release upload desktop-app "tools/desktop/out/$f" --clobber; fi
          done
          # The build descriptions last, so an app that sees a new commit always finds its installer.
          gh release upload desktop-app tools/desktop/out/ultimatetv-windows.json --clobber
          gh release upload desktop-app tools/desktop/out/ultimatetv-desktop.json --clobber

  # The TV app as a Mac disk image (#128), one per architecture. It has to run on macOS: the .app is
  # assembled with Apple's codesign and the disk image with hdiutil. docs/desktop.md has the Mac
  # section. Skipped until MPV_MAC_URL is set, for the same reason as the Windows job.
  desktop-macos:
    if: vars.MPV_MAC_URL != ''
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Put mpv inside the app
        env:
          MPV_MAC_URL: ${{ vars.MPV_MAC_URL }}
        run: bash tools/desktop/fetch-mpv.sh mac
      - name: Build the Apple Silicon disk image
        env:
          BRANCH: main
          ARCH: arm64
        run: bash tools/desktop/build-macos.sh
      # Beside out, not inside it: the Intel build deletes out before it starts.
      - name: Keep the Apple Silicon output
        run: |
          mkdir -p tools/desktop/kept
          mv tools/desktop/out/UltimateTV-arm64.dmg \
            tools/desktop/out/ultimatetv-macos.json tools/desktop/out/ultimatetv-desktop.json tools/desktop/kept/
      # The Intel build needs an Intel mpv, so the vendor folder is replaced for it.
      - name: Put the Intel mpv in
        if: vars.MPV_MAC_X64_URL != ''
        env:
          MPV_MAC_URL: ${{ vars.MPV_MAC_X64_URL }}
        run: |
          rm -rf tools/desktop/vendor/mpv
          bash tools/desktop/fetch-mpv.sh mac
      - name: Build the Intel disk image
        if: vars.MPV_MAC_X64_URL != ''
        env:
          BRANCH: main
          ARCH: x64
        run: bash tools/desktop/build-macos.sh
      - name: Gather the disk images
        run: |
          mv tools/desktop/kept/* tools/desktop/out/
          rmdir tools/desktop/kept
      - uses: actions/upload-artifact@v7
        with:
          name: ultimatetv-desktop-macos
          path: |
            tools/desktop/out/UltimateTV-arm64.dmg
            tools/desktop/out/UltimateTV-x64.dmg
            tools/desktop/out/ultimatetv-macos.json
            tools/desktop/out/ultimatetv-desktop.json
          if-no-files-found: error
      - name: Publish the disk images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-app > /dev/null 2>&1 || gh release create desktop-app --title "Desktop app (latest)" --notes "The TV app for Windows, macOS and Linux desktops, built from main by CI. See docs/desktop.md. The app updates itself from here (Settings › About)." --latest=false
          for f in UltimateTV-arm64.dmg UltimateTV-x64.dmg; do
            if [ -f "tools/desktop/out/$f" ]; then gh release upload desktop-app "tools/desktop/out/$f" --clobber; fi
          done
          gh release upload desktop-app tools/desktop/out/ultimatetv-macos.json --clobber
          gh release upload desktop-app tools/desktop/out/ultimatetv-desktop.json --clobber

  android-remote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The Hub's app-version.json matches the app
        run: |
          code="$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' android/app/build.gradle)"
          grep -q "\"versionCode\": $code," hub/public/remote/app-version.json || { echo "Update hub/public/remote/app-version.json to versionCode $code"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Build the phone remote APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ultimatetv-remote-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # The Hub downloads the app from this release for phones (Settings › the remote's banner).
      - name: Publish the APK for the Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ultimatetv-remote.apk
          gh release view remote-app > /dev/null 2>&1 || gh release create remote-app --title "Phone remote (latest)" --notes "Built from main by CI. The Hub serves it at /api/remote/app.apk." --latest=false
          gh release upload remote-app ultimatetv-remote.apk --clobber

  # The watching client for phones and tablets (android/client): its own APK beside the remote.
  android-client:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The Hub's client-app.json matches the app
        run: |
          code="$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' android/client/build.gradle)"
          grep -q "\"versionCode\": $code," hub/public/setup/client-app.json || { echo "Update hub/public/setup/client-app.json to versionCode $code"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Build the Android client APK
        working-directory: android
        run: gradle --no-daemon :client:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ultimatetv-client-apk
          path: android/client/build/outputs/apk/debug/client-debug.apk
          if-no-files-found: error
      # The Hub serves it to phones at /api/client/app.apk.
      - name: Publish the APK for the Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/client/build/outputs/apk/debug/client-debug.apk ultimatetv.apk
          gh release view client-app > /dev/null 2>&1 || gh release create client-app --title "Android client (latest)" --notes "Built from main by CI. The Hub serves it at /api/client/app.apk." --latest=false
          gh release upload client-app ultimatetv.apk --clobber
