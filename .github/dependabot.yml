# Automated dependency updates (#95): one pull request per ecosystem per week, with
# the changes in a week grouped into a single PR so the checklist stays short.
#
# Major bumps are grouped apart from minor and patch ones (#146): they are the ones
# that need a migration, and mixing them in meant a single bad major held back every
# patch behind it. So each ecosystem gets two groups a week: minor+patch, which should
# normally just be reviewed and merged, and major, which is read carefully.
version: 2
updates:
  # The npm workspaces (shared, hub, ui, box, tools/probe) and the root tooling.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Both Android apps: the gradle files live under android/ (app/ is the phone remote,
  # client/ is the watching client).
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      gradle-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # The GitHub Actions in .github/workflows/ci.yml (checkout, setup-node,
  # setup-buildx-action, build-push-action).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # The Hub image's base images in the root Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # The PXE server image's base images in tools/pxe/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/tools/pxe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker-pxe-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-pxe-major:
        patterns:
          - "*"
        update-types:
          - "major"
