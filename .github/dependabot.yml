# Automated dependency updates (#95): one pull request per ecosystem per week, with
# the changes in a week grouped into a single PR so the checklist stays short.
version: 2
updates:
  # The npm workspaces (shared, hub, ui, box, tools/probe) and the root tooling.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Both Android apps: the gradle files live under android/ (app/ is the phone remote,
  # client/ is the watching client).
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # The GitHub Actions in .github/workflows/ci.yml (checkout, setup-node,
  # setup-buildx-action, build-push-action).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # The Hub image's base images in the root Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # The PXE server image's base images in tools/pxe/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/tools/pxe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker-pxe:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
