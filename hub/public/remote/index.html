<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<title>UltimateTV Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg: #070b14; --panel: #121b2e; --panel-2: #1a2640; --fg: #f3f6fb; --muted: #8d99b0; --accent: #3d8bff; --accent-2: #00c2d1; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.3 Inter, "Noto Sans", Roboto, system-ui, sans-serif; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 14px); }
  header { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .conn { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #66728a; }
  .conn.ok .dot { background: #35c27a; box-shadow: 0 0 8px #35c27a; }
  .conn.bad .dot { background: #ff5468; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 14px; max-width: 420px; width: 100%; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: var(--panel); border-radius: 16px; touch-action: manipulation; transition: transform .08s, background .08s; }
  button:active, button.pressed { transform: scale(.93); background: var(--panel-2); }
  .row { display: grid; gap: 12px; }
  .r3 { grid-template-columns: repeat(3, 1fr); }
  .r4 { grid-template-columns: repeat(4, 1fr); }
  .r3 button, .r4 button { height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); }
  .r3 button svg, .r4 button svg { width: 24px; height: 24px; color: var(--fg); }
  .pad { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1c2944, #0f1729); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.45); touch-action: none; }
  .pad button { position: absolute; background: transparent; border-radius: 0; color: var(--fg); display: grid; place-items: center; }
  .pad button:active, .pad button.pressed { background: rgba(255,255,255,.07); transform: none; }
  .pad .up { top: 0; left: 30%; width: 40%; height: 30%; border-radius: 50% 50% 0 0 / 70% 70% 0 0; }
  .pad .down { bottom: 0; left: 30%; width: 40%; height: 30%; border-radius: 0 0 50% 50% / 0 0 70% 70%; }
  .pad .left { left: 0; top: 30%; width: 30%; height: 40%; border-radius: 50% 0 0 50% / 50% 0 0 50%; }
  .pad .right { right: 0; top: 30%; width: 30%; height: 40%; border-radius: 0 50% 50% 0 / 0 50% 50% 0; }
  .pad .ok { left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%; background: linear-gradient(145deg, #2a3a5e, #1a2640); box-shadow: 0 6px 16px rgba(0,0,0,.4); font-weight: 800; font-size: 18px; letter-spacing: .05em; }
  .pad .ok:active, .pad .ok.pressed { background: var(--accent); }
  .pad svg { width: 30px; height: 30px; }
  .colours button { height: 40px; }
  .c-red { background: #c62d37 !important; } .c-green { background: #23944a !important; } .c-yellow { background: #d9a91f !important; } .c-blue { background: #275fc0 !important; }
  .media { grid-template-columns: 1fr 1fr 1.3fr 1fr 1fr; }
  .media button { height: 54px; display: grid; place-items: center; }
  .media svg { width: 26px; height: 26px; }
  .media .rec svg { color: #ff3b4e; }
  .ch { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rocker { display: flex; align-items: center; justify-content: space-between; background: var(--panel); border-radius: 16px; overflow: hidden; }
  .rocker button { flex: 1; height: 54px; border-radius: 0; background: transparent; font-size: 22px; font-weight: 700; }
  .rocker span { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .text { display: flex; gap: 10px; }
  .text input { flex: 1; min-width: 0; height: 50px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: var(--panel); color: var(--fg); padding: 0 14px; font: inherit; font-size: 16px; }
  .text button { width: 64px; background: var(--accent); font-weight: 700; }
  .numbers { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .numbers.show { display: grid; }
  .numbers button { height: 50px; font-size: 22px; font-weight: 700; }
  .install { display: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 700; height: 46px; }
  .install.show { display: block; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .gear { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--panel); color: var(--fg); }
  .gear svg { width: 22px; height: 22px; }
  .r4 .mic { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .r4 .mic svg { color: #fff; }
  .mic.listening { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(61, 139, 255, .25); } }
  .banner { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(61,139,255,.22), rgba(0,194,209,.18)); border: 1px solid rgba(61,139,255,.45); font-size: 14px; color: var(--fg); text-decoration: none; }
  .banner span { flex: 1; }
  .banner small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .banner .x { flex: none; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.08); font-size: 16px; }
  .heard { min-height: 1.3em; text-align: center; color: var(--muted); font-size: 13px; margin: -4px 0 0; }
  .heard b { color: var(--fg); font-weight: 600; }
  [hidden] { display: none !important; }
  main { overflow-y: auto; }
  body { padding-bottom: calc(env(safe-area-inset-bottom) + 76px); }
  .np { display: grid; grid-template-columns: 64px 1fr; gap: 6px 12px; padding: 12px; margin-bottom: 10px; border-radius: 18px; background: linear-gradient(135deg, #16223a, #101a2e); border: 1px solid rgba(255,255,255,.07); max-width: 420px; width: 100%; margin-left: auto; margin-right: auto; }
  .np-art { width: 64px; height: 64px; border-radius: 12px; background: #1d2a44 center / cover no-repeat; grid-row: span 2; }
  .np-text { min-width: 0; }
  .np-text b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .np-text span, .np-text small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .np-text small { color: var(--accent-2); }
  .np-progress { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .np-progress input { width: 100%; accent-color: var(--accent); height: 24px; margin: 0; }
  .np-controls { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; }
  .np-controls button { flex: 1; height: 42px; border-radius: 12px; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .np-controls svg { width: 20px; height: 20px; }
  #np-play[data-state="playing"] .i-play, #np-play[data-state="paused"] .i-pause { display: none; }
  #np-live { color: #ff5468; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; padding: 8px 18px calc(env(safe-area-inset-bottom) + 8px); background: rgba(7, 11, 20, .94); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,.07); z-index: 5; }
  .tabbar button, .tabbar a { flex: 1; text-decoration: none; border-radius: 16px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); background: transparent; }
  .tabbar button svg, .tabbar a svg { width: 22px; height: 22px; }
  .tabbar button.on { color: var(--fg); background: var(--panel); }
  .browse { flex: 1; display: flex; flex-direction: column; max-width: 560px; width: 100%; margin: 0 auto; min-height: 0; user-select: text; -webkit-user-select: text; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; flex: none; }
  .chips button { flex: none; padding: 9px 14px; border-radius: 99px; font-size: 14px; background: var(--panel); color: var(--muted); }
  .chips button.on { background: var(--accent); color: #fff; }
  #browse-body { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; margin: 0; font-size: 14px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 14px; width: 100%; }
  .item .logo { flex: none; width: 54px; height: 40px; border-radius: 8px; background: #0d1526; display: grid; place-items: center; font-size: 12px; color: var(--muted); overflow: hidden; }
  .item .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .item .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .item .text b { font-size: 14px; }
  .item .text span { font-size: 14px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .text small { font-size: 12px; color: var(--muted); }
  .item .tick { color: #35c27a; }
  .rec { color: #ff5468; font-style: normal; font-size: 11px; }
  .bar { display: block; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .rail-title { font-size: 15px; margin: 14px 0 8px; }
  .rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .poster { flex: none; width: 108px; padding: 0; background: transparent; text-align: left; display: flex; flex-direction: column; gap: 4px; }
  .poster img, .poster > span { width: 108px; height: 162px; border-radius: 10px; object-fit: cover; background: var(--panel); display: grid; place-items: center; font-size: 12px; padding: 6px; text-align: center; }
  .poster img { padding: 0; }
  .poster small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button { flex: 1; height: 38px; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--panel-2); color: var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .tile { padding: 8px; border-radius: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
  .tile img, .tile .noimg { width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; background: #0d1526; display: grid; place-items: center; font-size: 30px; color: var(--muted); }
  .tile b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search input { width: 100%; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: var(--panel); color: var(--fg); padding: 0 14px; font: inherit; margin-bottom: 10px; }
  .sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; }
  .sheet-body { width: 100%; max-height: 86vh; overflow-y: auto; background: #0f1729; border-radius: 22px 22px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); user-select: text; -webkit-user-select: text; }
  .sheet-body h2 { margin: 4px 0 4px; font-size: 20px; }
  .sheet-body h3 { margin: 16px 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .sheet-body .meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .sheet-body .overview { font-size: 14px; line-height: 1.45; margin: 0 0 12px; color: #c9d2e3; }
  .sheet-body .hero { height: 150px; margin: -18px -18px 12px; border-radius: 22px 22px 0 0; background: center / cover no-repeat; }
  .sheet-body .cover { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; }
  .sheet-body select { width: 100%; height: 44px; border-radius: 12px; background: var(--panel); color: var(--fg); border: 1px solid rgba(255,255,255,.1); padding: 0 10px; font: inherit; margin: 6px 0 10px; }
  .actions { display: flex; gap: 10px; margin: 10px 0; }
  .actions button { flex: 1; height: 46px; border-radius: 12px; font-weight: 700; font-size: 15px; }
  .actions .primary { background: var(--accent); }
  .sheet-body textarea, .sheet-body .field { width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: var(--panel); color: var(--fg); padding: 12px 14px; font: inherit; margin-bottom: 10px; }
  .sheet-body textarea { min-height: 96px; resize: vertical; }
  .flash-preview { display: flex; height: 30px; border-radius: 6px; overflow: hidden; font: 700 12px/30px Arial, sans-serif; margin: 2px 0 12px; }
  .flash-preview b { background: #1a1a1a; padding: 0 8px; white-space: nowrap; }
  .flash-preview i { font-style: normal; background: #bb1919; padding: 0 8px; white-space: nowrap; }
  .flash-preview span { flex: 1; background: #fff; color: #111; padding: 0 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
  .row-btn { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 6px; border-radius: 12px; font-size: 14px; }
  .row-btn.on { background: var(--accent); }
  .link { display: block; width: 100%; margin-top: 10px; height: 44px; background: transparent; color: var(--muted); }
  .prog { padding: 10px 0; }
  .prog small { color: var(--accent-2); font-size: 12px; }
  .prog b { display: block; font-size: 16px; margin: 2px 0; }
  .prog span { display: block; color: var(--muted); font-size: 13px; }
  .prog p { font-size: 13px; color: #c9d2e3; margin: 6px 0 0; line-height: 1.4; }
  .ptoast { position: fixed; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 84px); max-width: 420px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: #1d2a44; border: 1px solid rgba(255,255,255,.1); font-size: 14px; text-align: center; transform: translateY(200%); opacity: 0; transition: transform .2s, opacity .2s; z-index: 20; pointer-events: none; }
  .ptoast.show { transform: none; opacity: 1; }
  .ptoast.bad { border-color: #ff5468; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" id="brand-mark">U</span><span id="brand-name">TV Remote</span></div>
  <div class="head-right">
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">Connecting…</span><button id="change-hub" hidden style="height:30px;padding:0 10px;font-size:12px;margin-left:6px">Change Hub</button></div>
    <a class="gear" href="/setup/" id="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<section class="np" id="np" hidden>
  <div class="np-art" id="np-art"></div>
  <div class="np-text"><b id="np-title"></b><span id="np-sub"></span><small id="np-quality"></small></div>
  <div class="np-progress"><span id="np-time"></span><input type="range" id="np-range" min="0" max="1" step="1000" aria-label="Position"><span id="np-left"></span></div>
  <div class="np-controls">
    <button id="np-back" aria-label="Back 30 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M4.5 10A8 8 0 1 1 6 16.5"/></svg></button>
    <button id="np-play" aria-label="Play or pause" data-state="playing"><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l11-7z"/></svg></button>
    <button id="np-fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v6h-6"/><path d="M19.5 10A8 8 0 1 0 18 16.5"/></svg></button>
    <button id="np-stop" aria-label="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <button id="np-live" hidden>LIVE</button>
    <button id="np-tracks" hidden>Audio</button>
  </div>
</section>
<main id="tab-remote">
  <button class="install" id="install">Install as an app</button>
  <a class="banner" id="app-banner" href="/api/remote/app.apk" hidden><span id="app-banner-text"></span><button class="x" id="app-banner-x" aria-label="Not now">×</button></a>
  <p class="heard" id="heard"></p>

  <div class="row r4">
    <button data-key="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
    <button data-key="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 10v9"/></svg>Guide</button>
    <button class="mic" id="voice" aria-label="Voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voice</button>
    <button data-key="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Info</button>
  </div>

  <div class="pad" id="pad">
    <button class="up" data-key="up" data-repeat aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="left" data-key="left" data-repeat aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="ok" data-key="ok">OK</button>
    <button class="right" data-key="right" data-repeat aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="down" data-key="down" data-repeat aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

  <div class="row r3">
    <button data-key="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Back</button>
    <button id="num-toggle"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="18" cy="6" r="1.8"/><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/><circle cx="6" cy="18" r="1.8"/><circle cx="12" cy="18" r="1.8"/><circle cx="18" cy="18" r="1.8"/></svg>123</button>
    <button data-key="yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Options</button>
  </div>

  <div class="numbers" id="numbers">
    <button data-key="digit1">1</button><button data-key="digit2">2</button><button data-key="digit3">3</button>
    <button data-key="digit4">4</button><button data-key="digit5">5</button><button data-key="digit6">6</button>
    <button data-key="digit7">7</button><button data-key="digit8">8</button><button data-key="digit9">9</button>
    <span></span><button data-key="digit0">0</button><span></span>
  </div>

  <div class="row r4 colours">
    <button class="c-red" data-key="red" aria-label="Red"></button>
    <button class="c-green" data-key="green" aria-label="Green"></button>
    <button class="c-yellow" data-key="yellow" aria-label="Yellow"></button>
    <button class="c-blue" data-key="blue" aria-label="Blue"></button>
  </div>

  <div class="row media">
    <button data-key="rewind" aria-label="Rewind"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/></svg></button>
    <button class="rec" data-key="record" aria-label="Record"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></button>
    <button data-key="playPause" aria-label="Play or pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5v13l9-6.5zM15 5h3v14h-3zM19.5 5h2v14h-2z"/></svg></button>
    <button data-key="stop" aria-label="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <button data-key="fastForward" aria-label="Fast forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6l7 6-7 6zM4 6l7 6-7 6z"/></svg></button>
  </div>

  <div class="ch">
    <div class="rocker"><button data-key="channelDown" aria-label="Channel down">−</button><span>CH</span><button data-key="channelUp" aria-label="Channel up">+</button></div>
    <div class="rocker"><button data-key="back" aria-label="Exit">Exit</button></div>
  </div>

  <form class="text" id="text">
    <input id="text-input" placeholder="Type to search on the TV" autocomplete="off" enterkeyhint="search">
    <button type="submit">Send</button>
  </form>
  <p class="hint">Hold an arrow to keep moving. Tap Voice and say “watch BBC One”, “search for Dune”, “pause” or “down three times”.</p>
</main>
<main class="browse" id="tab-browse" hidden>
  <div class="chips">
    <button data-browse="guide" class="on">TV Guide</button><button data-browse="movie">Films</button><button data-browse="series">TV</button><button data-browse="recordings">Recordings</button><button data-browse="music">Music</button><button data-browse="search">Search</button>
  </div>
  <div id="browse-body"></div>
</main>
<nav class="tabbar">
  <button data-tab="remote" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="4"/><circle cx="12" cy="9" r="2.5"/><path d="M10 15h.01M14 15h.01M10 18h.01M14 18h.01"/></svg>Remote</button>
  <button data-tab="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Watch</button>
  <button id="news-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13"/></svg>News</button>
  <a href="/setup/stats.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</a>
</nav>
<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheet-body"></div></div>
<script>
const conn = document.getElementById("conn");
const connText = document.getElementById("conn-text");
const setConn = (state, text) => { conn.className = "conn " + state; connText.textContent = text; };

async function send(path, body) {
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(res.statusText);
    setConn("ok", "Connected");
  } catch {
    setConn("bad", "Can't reach the Hub");
  }
}
const press = (action) => {
  if (navigator.vibrate) navigator.vibrate(12);
  void send("/api/remote/key", { action });
};

// Buttons: press on touch down (feels instant); arrows repeat while held. The pressed look is its
// own class: the Down arrow's class is "down", and sharing it moved buttons around the pad.
for (const b of document.querySelectorAll("[data-key]")) {
  let timer, repeat;
  const start = (e) => {
    e.preventDefault();
    b.classList.add("pressed");
    press(b.dataset.key);
    if (b.hasAttribute("data-repeat")) timer = setTimeout(() => (repeat = setInterval(() => press(b.dataset.key), 140)), 420);
  };
  const end = () => { b.classList.remove("pressed"); clearTimeout(timer); clearInterval(repeat); };
  b.addEventListener("pointerdown", start);
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, end);
}

// Swipe on the pad as well as tapping its arrows.
let swipe = null;
const pad = document.getElementById("pad");
pad.addEventListener("touchstart", (e) => { const t = e.touches[0]; swipe = { x: t.clientX, y: t.clientY }; }, { passive: true });
pad.addEventListener("touchend", (e) => {
  if (!swipe) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
  press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});

document.getElementById("num-toggle").addEventListener("click", () => document.getElementById("numbers").classList.toggle("show"));
document.getElementById("text").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("text-input");
  if (voiceByKeyboard) {
    voiceByKeyboard = false;
    input.placeholder = "Type to search on the TV";
    void sendVoice(input.value);
    input.value = "";
  } else {
    void send("/api/remote/text", { text: input.value });
  }
  input.blur();
});

// Voice control. The Android app listens with the phone's own speech recogniser; Chrome can only
// use the microphone over https, so on the plain-http Hub the keyboard's dictation key stands in.
const heard = document.getElementById("heard");
const voiceBtn = document.getElementById("voice");
let voiceByKeyboard = false;
const showHeard = (said, did) => {
  heard.textContent = "";
  const b = document.createElement("b");
  b.textContent = said;
  heard.append(b);
  if (did) heard.append(` → ${did}`);
};
async function sendVoice(text) {
  text = String(text || "").trim();
  if (!text) return;
  showHeard(`“${text}”`, "…");
  try {
    const res = await fetch("/api/remote/voice", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || res.statusText);
    setConn("ok", "Connected");
    showHeard(`“${text}”`, r.tvConnected === false ? `${r.say} (the TV app isn't connected)` : r.say);
  } catch {
    setConn("bad", "Can't reach the Hub");
    showHeard(`“${text}”`, "couldn't reach the Hub");
  }
}
const stopListening = () => voiceBtn.classList.remove("listening");
window.utvVoiceResult = (text) => { stopListening(); void sendVoice(text); };
window.utvVoiceError = (message) => { stopListening(); heard.textContent = message || "Didn't catch that"; };
voiceBtn.addEventListener("click", () => {
  if (navigator.vibrate) navigator.vibrate(12);
  if (window.UltimateTVApp && window.UltimateTVApp.listen) {
    voiceBtn.classList.add("listening");
    window.UltimateTVApp.listen();
    return;
  }
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (Recognition && window.isSecureContext) {
    const r = new Recognition();
    r.lang = "en-GB";
    r.interimResults = false;
    r.maxAlternatives = 1;
    r.onresult = (e) => window.utvVoiceResult(e.results[0][0].transcript);
    r.onerror = (e) => window.utvVoiceError(e.error === "no-speech" ? "Didn't hear anything" : "Voice didn't work: " + e.error);
    r.onend = stopListening;
    voiceBtn.classList.add("listening");
    r.start();
    return;
  }
  voiceByKeyboard = true;
  const input = document.getElementById("text-input");
  input.placeholder = "Tap the keyboard's mic, speak, then Send";
  input.focus();
  heard.textContent = "Tap the microphone on your keyboard and speak. The Android app listens by itself.";
});

// The app's name, as set on the settings page (remembered so the header doesn't flicker).
function showAppName(name) {
  if (!name) return;
  document.getElementById("brand-mark").textContent = name.slice(0, 1).toUpperCase();
  document.getElementById("brand-name").textContent = name;
  document.title = `${name} Remote`;
  try { localStorage.setItem("utv-app-name", name); } catch {}
}
try { showAppName(localStorage.getItem("utv-app-name")); } catch {}
fetch("/api/settings").then((r) => r.json()).then((s) => showAppName(s.appName)).catch(() => {});

// Check the Hub is there.
fetch("/api/health").then((r) => (r.ok ? setConn("ok", "Connected") : setConn("bad", "Hub error"))).catch(() => setConn("bad", "Can't reach the Hub"));

// Install prompt (Chrome on Android). Over plain http Chrome offers Add to Home screen from its menu instead.
let deferred;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; document.getElementById("install").classList.add("show"); });
document.getElementById("install").addEventListener("click", async () => { if (deferred) { deferred.prompt(); deferred = null; document.getElementById("install").classList.remove("show"); } });
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});

// Inside the Android app: let it switch Hub.
if (window.UltimateTVApp) {
  const b = document.getElementById("change-hub");
  b.hidden = false;
  b.addEventListener("click", () => window.UltimateTVApp.changeHub());
}

// The Android app, served by the Hub: offer it on Android phones, and say when a newer one is out.
(async () => {
  const banner = document.getElementById("app-banner");
  const text = document.getElementById("app-banner-text");
  const latest = await fetch("app-version.json", { cache: "no-store" }).then((r) => r.json()).catch(() => null);
  if (!latest) return;
  const appUrl = new URL("/api/remote/app.apk", location.href).href;
  const inApp = Boolean(window.UltimateTVApp);
  const mine = inApp ? (window.UltimateTVApp.version ? window.UltimateTVApp.version() : 1) : 0;
  let dismissed = "";
  try { dismissed = localStorage.getItem("utv-app-banner") || ""; } catch {}
  const show = (html) => { text.innerHTML = html; banner.hidden = false; };
  if (inApp && mine < latest.versionCode) {
    // 0.1 and 0.2 were signed with a throwaway key, so Android won't install over them.
    const once = mine < 3 ? "<small>If Android says the app isn't installed, uninstall the old remote first (just this once).</small>" : "";
    if (window.UltimateTVApp.open) {
      show(`<b>New remote app ${latest.versionName}</b>: tap to install.${once}`);
      banner.addEventListener("click", (e) => { e.preventDefault(); window.UltimateTVApp.open(appUrl); });
    } else {
      // Older apps can't download: Chrome has to fetch it.
      show(`<b>New remote app ${latest.versionName}</b>, with voice control. Open this in Chrome to install it:<small>${appUrl}</small>${once}`);
      banner.addEventListener("click", (e) => e.preventDefault());
    }
  } else if (!inApp && /Android/i.test(navigator.userAgent) && dismissed !== String(latest.versionCode)) {
    show(`<b>Get the Android app</b>: voice control and the phone's volume keys for channels. Tap to download.`);
  }
  document.getElementById("app-banner-x").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    banner.hidden = true;
    try { localStorage.setItem("utv-app-banner", String(latest.versionCode)); } catch {}
  });
})();

// Keep the screen awake while the remote is open.
async function wake() { try { await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
wake();
</script>
<script src="phone.js"></script>
</body>
</html>
